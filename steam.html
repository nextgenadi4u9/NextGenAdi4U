        /* --- NEW PARTICLE BACKGROUND CSS --- */

            position: fixed;
            top: 0;

            width: 100%;

<body>

    <canvas id="dustCanvas"></canvas>

    <header>
        <div class="header-container">

            </div>

            <div class="social-nav">
                <a href="https://www.youtube.com/channel/UCEkAwiNuddUI5aXCN4x3spA" target="_blank"><i class="fab fa-youtube"></i></a>

    <main>
        <section class="hero page-hero">
            <h1 class="main-heading">Premium Accounts</h1>
            <p class="sub-text">Exclusive Access & Lifetime Accounts</p>
        </section>

        <section class="grid-container">
            <div class="item-card">
                <div class="card-img">
                    <img src="STEAM1.jpg" alt="Steam Accounts">

    <footer>
        <div class="footer-content">
            <div class="footer-bottom">

            </div>
        </div>

    <script>
        // --- SEARCH LOGIC ---
        document.addEventListener("DOMContentLoaded", function() {
            const searchInput = document.querySelector('.search-bar input');
            const cards = document.querySelectorAll('.item-card');

            if (searchInput) {
                searchInput.addEventListener('keyup', function(event) {
                    const query = event.target.value.toLowerCase();
                    cards.forEach(card => {
                        const title = card.querySelector('h3').textContent.toLowerCase();
                        const desc = card.querySelector('p').textContent.toLowerCase();
                        if (title.includes(query) || desc.includes(query)) {
                            card.style.display = "flex";
                        } else {
                            card.style.display = "none";
                        }
                    });
                });
            }
        });

        // --- FLOATING NEON DUST ANIMATION ---
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; // कणांचा आकार
                this.speedX = Math.random() * 1 - 0.5; // आडवा वेग
                this.speedY = Math.random() * 1 - 0.5; // उभा वेग
                this.color = 'rgba(0, 210, 255, ' + (Math.random() * 0.5 + 0.1) + ')'; // निळा रंग (पारदर्शक)
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // स्क्रीनच्या बाहेर गेले की परत आत आणणे
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 15000; // स्क्रीन साईज प्रमाणे कण
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        initParticles();
        animateParticles();
    </script>

</body>
</html>
