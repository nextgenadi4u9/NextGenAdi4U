<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6262033771925685"
     crossorigin="anonymous"></script>

    <title>NextGenAdi4U | Enter the Future</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 🚀 HYPER-EXTREME BASE STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; cursor: none; }
        body { background-color: #020202; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; color: white; perspective: 1000px; }
        
        /* --- 🌌 CUSTOM CURSOR --- */
        #customCursor { width: 20px; height: 20px; border: 2px solid #00d2ff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; transition: transform 0.1s ease; box-shadow: 0 0 10px #00d2ff; }

        /* --- 🌀 EXTREME LOADER --- */
        #loader {
            position: fixed; width: 100%; height: 100%; background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
        }
        .spinner-box { position: relative; width: 100px; height: 100px; }
        .spinner {
            width: 100%; height: 100%; border: 4px solid transparent; border-top: 4px solid #00d2ff;
            border-radius: 50%; animation: spin 0.8s linear infinite; filter: drop-shadow(0 0 10px #00d2ff);
        }
        .spinner-inner {
            position: absolute; top: 15%; left: 15%; width: 70%; height: 70%; border: 4px solid transparent;
            border-bottom: 4px solid #fff; border-radius: 50%; animation: spin-reverse 1.2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        /* --- ✨ 3D GLASS CONTENT CARD --- */
        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; transition: opacity 2s ease; }
        
        .intro-content { 
            position: relative; z-index: 10; text-align: center;
            background: rgba(255, 255, 255, 0.03); 
            padding: 60px 80px; border-radius: 30px; 
            border: 1px solid rgba(0, 210, 255, 0.2); 
            backdrop-filter: blur(25px); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.1);
            opacity: 0; transform: translateZ(-100px) rotateX(20deg);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .intro-content.show { opacity: 1; transform: translateZ(0) rotateX(0); }
        #particleCanvas.show { opacity: 1; }

        /* --- 💡 GLOWING TEXT --- */
        .intro-content h1 { 
            font-size: 4.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 8px; margin-bottom: 15px;
            background: linear-gradient(to right, #fff 20%, #00d2ff 50%, #fff 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite; text-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        .intro-content p { font-size: 1.4rem; color: #00d2ff; margin-bottom: 50px; letter-spacing: 5px; font-weight: 300; text-transform: uppercase; }

        /* --- ⚡️ HYPER BUTTON --- */
        .enter-btn { 
            position: relative; padding: 18px 50px; font-size: 1.3rem; font-weight: 800; color: #fff; 
            background: linear-gradient(45deg, #00d2ff, #004e92); border: none; border-radius: 100px; 
            cursor: none; text-decoration: none; display: inline-block; transition: 0.5s; 
            text-transform: uppercase; letter-spacing: 3px; overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
        .enter-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .enter-btn:hover::before { left: 100%; }
        .enter-btn:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 10px 40px #00d2ff; }

        @media (max-width: 768px) { .intro-content h1 { font-size: 2.8rem; } .intro-content { padding: 40px 20px; width: 90%; } }
    </style>
</head>
<body>

    <div id="customCursor"></div>

    <div id="loader">
        <div class="spinner-box">
            <div class="spinner"></div>
            <div class="spinner-inner"></div>
        </div>
        <div class="loading-text" style="margin-top: 30px; color: #00d2ff; letter-spacing: 4px;">NextGenAdi4U Systems Loading...</div>
    </div>

    <canvas id="particleCanvas"></canvas>

    <audio id="welcomeSound" loop preload="auto">
        <source src="audio" type="audio/wav">
        <source src=".mpeg" type="audio/mpeg">
    </audio>

    <div class="intro-content" id="mainContent">
        <h1 data-tilt>NextGenAdi4U</h1>
        <p>Your Portal to the Premium Universe</p>
        
        <a href="home.html" class="enter-btn">
            Enter Universe <i class="fas fa-rocket"></i>
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script>
        // --- 🖱️ CUSTOM CURSOR LOGIC ---
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // --- ⏳ LOADING & TRANSITION ---
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loader');
                const content = document.getElementById('mainContent');
                const canvas = document.getElementById('particleCanvas');
                
                loader.style.opacity = "0";
                setTimeout(() => loader.style.visibility = "hidden", 1000);
                content.classList.add('show');
                canvas.classList.add('show');
                
                // 3D Tilt Effect on the Card
                VanillaTilt.init(document.querySelector(".intro-content"), {
                    max: 10, speed: 400, glare: true, "max-glare": 0.2,
                });
            }, 3000);
        });

        // --- 🔊 AUTO AUDIO LOGIC ---
        function playBroadcast() {
            var audio = document.getElementById("welcomeSound");
            audio.play().then(() => {
                window.removeEventListener('mousemove', playBroadcast);
                window.removeEventListener('click', playBroadcast);
            }).catch(err => {});
        }
        window.addEventListener('mousemove', playBroadcast);
        window.addEventListener('click', playBroadcast);

        // --- ✨ ADVANCED PARTICLE SCRIPT ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 150 };
        
        window.addEventListener('mousemove', function(e) { mouse.x = e.x; mouse.y = e.y; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
                
                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius) {
                    if (mouse.x < this.x && this.x < canvas.width - 10) this.x += 2;
                    if (mouse.x > this.x && this.x > 10) this.x -= 2;
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.8)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < 150; i++) particlesArray.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            connect();
            requestAnimationFrame(animate);
        }

        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dist = ((particlesArray[a].x - particlesArray[b].x)**2) + ((particlesArray[a].y - particlesArray[b].y)**2);
                    if (dist < (canvas.width/8) * (canvas.height/8)) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist/15000})`;
                        ctx.lineWidth = 0.5; ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }
        init(); animate();
    </script>
</body>
</html>
