<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6262033771925685"
     crossorigin="anonymous"></script>

    <title>Welcome - NextGenAdi4U</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; color: white; }
        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .intro-content { position: relative; z-index: 10; text-align: center; background: rgba(0, 0, 0, 0.6); padding: 40px 60px; border-radius: 20px; border: 1px solid rgba(0, 210, 255, 0.3); backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); animation: fadeIn 1.5s ease-in-out; }
        .intro-content h1 { font-size: 3.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px; background: linear-gradient(90deg, #fff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .intro-content p { font-size: 1.2rem; color: #aaa; margin-bottom: 40px; letter-spacing: 2px; }
        .enter-btn { position: relative; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; color: #00d2ff; background: transparent; border: 2px solid #00d2ff; border-radius: 50px; cursor: pointer; overflow: hidden; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; display: inline-block; z-index: 20; }
        .enter-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .intro-content h1 { font-size: 2.5rem; } .intro-content { padding: 30px 20px; width: 90%; } }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <audio id="welcomeSound" loop preload="auto">
        <source src="Activating.wav" type="audio/wav">
        <source src="brodcast.mpeg" type="audio/mpeg">
    </audio>

    <div class="intro-content">
        <h1>NextGenAdi4U</h1>
        <p>EXPLORE THE PREMIUM WORLD</p>
        
        <a href="home.html" class="enter-btn">
            Enter Universe <i class="fas fa-rocket"></i>
        </a>
    </div>

    <script>
        // --- 🔊 AUDIO AUTOPLAY FIX (User Interaction) ---
        document.addEventListener('DOMContentLoaded', function() {
            var audio = document.getElementById("welcomeSound");
            
            function startAudio() {
                audio.play().then(() => {
                    console.log("Broadcast audio started!");
                    // एकदा सुरू झाले की इव्हेंट लिसनर्स काढून टाकणे
                    window.removeEventListener('click', startAudio);
                    window.removeEventListener('mousemove', startAudio);
                    window.removeEventListener('touchstart', startAudio);
                }).catch(err => console.log("Waiting for user interaction..."));
            }

            // युजरने स्क्रीनवर कुठेही क्लिक किंवा माऊस हलवताच आवाज सुरू होईल
            window.addEventListener('click', startAudio);
            window.addEventListener('mousemove', startAudio);
            window.addEventListener('touchstart', startAudio);
        });

        // --- ✨ PARTICLE SCRIPT ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particlesArray;
        let mouse = { x: null, y: null, radius: (canvas.height/80) * (canvas.width/80) }
        
        window.addEventListener('mousemove', function(event) { mouse.x = event.x; mouse.y = event.y; });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size; this.color = color;
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false); ctx.fillStyle = '#00d2ff'; ctx.fill(); }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                let dx = mouse.x - this.x; let dy = mouse.y - this.y; let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - 10) this.x += 10;
                    if (mouse.x > this.x && this.x > 10) this.x -= 10;
                    if (mouse.y < this.y && this.y < canvas.height - 10) this.y += 10;
                    if (mouse.y > this.y && this.y > 10) this.y -= 10;
                }
                this.x += this.directionX; this.y += this.directionY; this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 5) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; let directionY = (Math.random() * 2) - 1;
                particlesArray.push(new Particle(x, y, directionX, directionY, size, '#00d2ff'));
            }
        }

        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        let opacityValue = 1 - (distance/20000); ctx.strokeStyle = 'rgba(0, 210, 255,' + opacityValue + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }

        function animate() { requestAnimationFrame(animate); ctx.clearRect(0, 0, innerWidth, innerHeight); for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); } connect(); }
        window.addEventListener('resize', function() { canvas.width = innerWidth; canvas.height = innerHeight; mouse.radius = ((canvas.height/80) * (canvas.height/80)); init(); });
        window.addEventListener('mouseout', function(){ mouse.x = undefined; mouse.y = undefined; });
        init(); animate();
    </script>
</body>
</html>
