<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfying Neon Burst - NextGenAdi4U</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        /* --- GAME STYLING --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Text select disable */
        }

        body {
            background-color: #050505; /* Deep Black */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: crosshair;
            font-family: 'Poppins', sans-serif;
        }

        /* Center Text */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none; /* Click pass-through */
            z-index: 10;
            transition: opacity 0.5s;
        }

        h1 {
            color: transparent;
            font-size: 3rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #00d2ff);
            -webkit-background-clip: text;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        p {
            color: #888;
            font-size: 1.2rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* Back Button styling to fit your theme */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            border: 1px solid #00d2ff;
            background: transparent;
            color: #00d2ff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
            transition: 0.3s;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <a href="home.html" class="back-btn">← Back Home</a>

    <div class="overlay" id="hint">
        <h1>NextGen Burst</h1>
        <p>Click & Drag to Explode Colors</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let hue = 0; // Color Cycle

        // --- MOUSE INTERACTION ---
        let mouse = {
            x: undefined,
            y: undefined
        }

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        canvas.addEventListener('click', function(e) {
            mouse.x = e.x;
            mouse.y = e.y;
            // Create massive explosion on click
            for(let i = 0; i < 50; i++){
                particles.push(new Particle(mouse.x, mouse.y, true));
            }
            // Hide text after first interaction
            hint.style.opacity = '0';
        });

        canvas.addEventListener('mousemove', function(e) {
            mouse.x = e.x;
            mouse.y = e.y;
            // Create small trail on move
            for(let i = 0; i < 3; i++){
                particles.push(new Particle(mouse.x, mouse.y, false));
            }
            hint.style.opacity = '0';
        });

        // --- PARTICLE CLASS ---
        class Particle {
            constructor(x, y, isExplosion) {
                this.x = x;
                this.y = y;
                
                // Random Size
                this.size = Math.random() * 10 + 2;
                
                // Physics
                let speed = isExplosion ? (Math.random() * 15 + 2) : (Math.random() * 3 + 1);
                let angle = Math.random() * Math.PI * 2;
                
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed;
                
                // Color (Neon HSL)
                this.color = 'hsl(' + hue + ', 100%, 50%)';
                
                // Gravity & Friction
                this.gravity = 0.5;
                this.friction = 0.95;
            }

            update() {
                this.speedY += this.gravity; // Apply Gravity
                this.speedX *= this.friction; // Apply Air Resistance
                this.speedY *= this.friction;

                this.x += this.speedX;
                this.y += this.speedY;

                // Bounce off floor
                if (this.y + this.size > canvas.height) {
                    this.speedY = -this.speedY * 0.6; // Lose energy on bounce
                    this.y = canvas.height - this.size;
                }
                
                // Bounce off walls
                if (this.x + this.size > canvas.width || this.x - this.size < 0) {
                    this.speedX = -this.speedX * 0.6;
                }

                // Shrink particle
                if (this.size > 0.2) this.size -= 0.1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow Effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            }
        }

        // --- ANIMATION LOOP ---
        function animate() {
            // Semi-transparent background for trail effect (satisfying motion blur)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0; // Reset shadow for performance

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Remove tiny particles
                if (particles[i].size <= 0.3) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            
            hue += 2; // Change color constantly
            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
