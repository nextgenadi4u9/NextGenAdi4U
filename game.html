<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d2ff">
    
   

    <title>Code Master - Ultimate Quiz</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CORE STYLES --- */
        :root {
            --primary: #00d2ff;
            --secondary: #7000ff;
            --success: #00ff88;
            --danger: #ff0055;
            --bg: #050505;
            --glass: rgba(20, 20, 20, 0.7);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex; flex-direction: column;

            /* Anti-Theft: Prevent Text Selection */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #dustCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }

        /* --- NAVIGATION --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: var(--border);
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; }
        .logo span { color: var(--primary); }
        .home-btn { color: #fff; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .home-btn:hover { color: var(--primary); transform: scale(1.1); }

        /* --- MAIN MENU (LANGUAGE SELECTION) --- */
        .menu-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 50px 20px; text-align: center; flex: 1;
        }

        .hero-title {
            font-family: 'Rajdhani', sans-serif; font-size: 3.5rem; margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; color: transparent;
        }
        .hero-sub { color: #aaa; margin-bottom: 50px; font-size: 1.1rem; }

        .lang-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px; width: 100%; max-width: 1000px;
        }

        .lang-card {
            background: var(--glass); border: var(--border);
            padding: 30px; border-radius: 20px; cursor: pointer;
            transition: all 0.4s ease; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .lang-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            transform: translateY(100%); transition: 0.4s;
        }

        .lang-card:hover {
            transform: translateY(-10px); box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            border-color: var(--primary);
        }
        .lang-card:hover::before { transform: translateY(0); }

        .lang-icon { font-size: 3rem; color: var(--primary); transition: 0.4s; }
        .lang-card:hover .lang-icon { transform: scale(1.2) rotate(10deg); color: #fff; }
        
        .lang-name { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; }
        .lang-desc { font-size: 0.8rem; color: #888; }

        /* --- GAME SCREEN --- */
        .game-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            min-height: 80vh; padding: 20px;
        }

        .quiz-container {
            background: rgba(15, 15, 25, 0.9); border: 1px solid var(--primary);
            border-radius: 20px; padding: 40px; width: 100%; max-width: 700px;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
            position: relative; overflow: hidden;
        }

        /* Progress Bar */
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: var(--primary); font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 6px; background: #333; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px var(--primary); }

        .question-text {
            font-size: 1.3rem; margin-bottom: 25px; line-height: 1.5; font-weight: 600;
        }
        .code-block {
            background: #111; padding: 15px; border-radius: 10px; border-left: 3px solid var(--primary);
            font-family: 'Fira Code', monospace; font-size: 0.9rem; color: #ff79c6; margin-bottom: 25px;
            display: none; /* Shown only if needed */
        }

        .options-list { display: grid; gap: 15px; }
        .option {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px; border-radius: 10px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 10px; font-size: 1rem;
        }
        .option:hover { background: rgba(0, 210, 255, 0.1); border-color: var(--primary); }
        
        .option.correct { background: rgba(0, 255, 136, 0.2) !important; border-color: var(--success) !important; color: var(--success); }
        .option.wrong { background: rgba(255, 0, 85, 0.2) !important; border-color: var(--danger) !important; color: var(--danger); }
        .option.disabled { pointer-events: none; opacity: 0.6; }

        /* Timer Circle */
        .timer-circle {
            position: absolute; top: 20px; right: 20px; width: 50px; height: 50px;
            border-radius: 50%; border: 3px solid #333; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-family: 'Rajdhani'; font-size: 1.2rem; color: var(--primary);
        }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 80vh; text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .score-circle {
            width: 150px; height: 150px; border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, #333 0%);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            position: relative; box-shadow: 0 0 30px rgba(0,210,255,0.3);
        }
        .score-inner {
            width: 130px; height: 130px; background: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .score-number { font-size: 2.5rem; font-weight: 800; font-family: 'Rajdhani'; color: #fff; }
        .score-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }

        .result-msg { font-size: 1.5rem; margin-bottom: 30px; font-weight: bold; }
        
        .action-btn {
            background: var(--primary); color: #000; padding: 12px 40px; border-radius: 30px;
            font-weight: bold; text-decoration: none; cursor: pointer; transition: 0.3s; border: none; font-size: 1rem;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 20px var(--primary); }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .lang-grid { grid-template-columns: 1fr 1fr; }
            .quiz-container { padding: 25px; width: 95%; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="dustCanvas"></canvas>

    <nav class="navbar">
        <div class="logo" onclick="goHome()" style="cursor: pointer;">NextGen<span>Adi4U</span></div>
        <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
    </nav>

    <div class="menu-screen" id="menuScreen">
        <h1 class="hero-title">Select Your Arena</h1>
        <p class="hero-sub">Choose a language to start the Hyper Quiz</p>
        
        <div class="lang-grid">
            <div class="lang-card" onclick="startGame('html')">
                <i class="fab fa-html5 lang-icon" style="color: #e34f26;"></i>
                <div class="lang-name">HTML5</div>
                <div class="lang-desc">Web Structure</div>
            </div>
            <div class="lang-card" onclick="startGame('css')">
                <i class="fab fa-css3-alt lang-icon" style="color: #264de4;"></i>
                <div class="lang-name">CSS3</div>
                <div class="lang-desc">Styling & Grid</div>
            </div>
            <div class="lang-card" onclick="startGame('js')">
                <i class="fab fa-js lang-icon" style="color: #f7df1e;"></i>
                <div class="lang-name">JavaScript</div>
                <div class="lang-desc">Logic & DOM</div>
            </div>
            <div class="lang-card" onclick="startGame('java')">
                <i class="fab fa-java lang-icon" style="color: #f89820;"></i>
                <div class="lang-name">Java</div>
                <div class="lang-desc">OOPs Concepts</div>
            </div>
            <div class="lang-card" onclick="startGame('c')">
                <i class="fas fa-copyright lang-icon" style="color: #555;"></i>
                <div class="lang-name">C Lang</div>
                <div class="lang-desc">System Core</div>
            </div>
            <div class="lang-card" onclick="startGame('cpp')">
                <i class="fas fa-code lang-icon" style="color: #00599c;"></i>
                <div class="lang-name">C++</div>
                <div class="lang-desc">High Performance</div>
            </div>
            <div class="lang-card" onclick="startGame('csharp')">
                <i class="fas fa-laptop-code lang-icon" style="color: #9b4f96;"></i>
                <div class="lang-name">C# (Sharp)</div>
                <div class="lang-desc">Game Dev</div>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="quiz-container">
            <div class="timer-circle" id="timer">15</div>
            
            <div class="progress-header">
                <span id="q-progress">Question 1/20</span>
                <span id="score-live">Score: 0</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>

            <h2 class="question-text" id="questionText">Loading Question...</h2>
            <div class="code-block" id="codeBlock"></div>

            <div class="options-list" id="optionsContainer">
            </div>
        </div>
    </div>

    <div class="result-screen" id="resultScreen">
        <div class="score-circle" id="finalCircle">
            <div class="score-inner">
                <span class="score-number" id="finalScore">0</span>
                <span class="score-label">Points</span>
            </div>
        </div>
        <h2 class="result-msg" id="resultMsg">Good Job!</h2>
        <div style="display: flex; gap: 20px;">
            <button class="action-btn" onclick="goHome()">Main Menu</button>
            <button class="action-btn" onclick="restartCurrent()">Play Again</button>
        </div>
    </div>

    <script>
        // --- 1. QUIZ DATABASE ---
        const database = {
            html: [
                { q: "What does HTML stand for?", o: ["Hyper Text Markup Language", "Hyperlink Text Mark Language", "Home Tool Markup Language", "Hyper Tool Multi Language"], a: 0 },
                { q: "Which tag is used for the largest heading?", o: ["<h6>", "<head>", "<h1>", "<heading>"], a: 2 },
                { q: "Which element creates a line break?", o: ["<break>", "<br>", "<lb>", "<ln>"], a: 1 },
                { q: "Choose the correct HTML element to define emphasized text", o: ["<i>", "<italic>", "<em>", "<bold>"], a: 2 },
                { q: "Which character is used to indicate an end tag?", o: ["*", "/", "<", "^"], a: 1 },
                { q: "What is the correct HTML for making a checkbox?", o: ["<check>", "<checkbox>", "<input type='checkbox'>", "<input type='check'>"], a: 2 },
                { q: "Which HTML attribute specifies an alternate text for an image?", o: ["alt", "title", "src", "longdesc"], a: 0 },
                { q: "Which HTML element is defined by the <ul> tag?", o: ["Ordered list", "Unordered list", "Underline list", "Universal list"], a: 1 },
                { q: "In HTML, which attribute is used to specify that an input field must be filled out?", o: ["validate", "required", "placeholder", "formvalidate"], a: 1 },
                { q: "Which doctype is correct for HTML5?", o: ["<!DOCTYPE html>", "<!DOCTYPE HTML5>", "<!DOCTYPE html public>", "<html5>"], a: 0 }
            ],
            css: [
                { q: "What does CSS stand for?", o: ["Creative Style Sheets", "Cascading Style Sheets", "Computer Style Sheets", "Colorful Style Sheets"], a: 1 },
                { q: "Which property is used to change the background color?", o: ["color", "bgcolor", "background-color", "bg-color"], a: 2 },
                { q: "How do you select an element with id 'demo'?", o: ["#demo", ".demo", "demo", "*demo"], a: 0 },
                { q: "Which property controls text size?", o: ["font-style", "text-size", "font-size", "text-style"], a: 2 },
                { q: "How do you make each word in a text start with a capital letter?", o: ["text-transform: capitalize", "text-style: capital", "transform: uppercase", "font-transform: capitalize"], a: 0 },
                { q: "Which property is used to change the font of an element?", o: ["font-family", "font-style", "font-weight", "font-text"], a: 0 },
                { q: "How do you select elements with class name 'test'?", o: ["#test", ".test", "test", "*test"], a: 1 },
                { q: "Which property generates space around the content, inside the border?", o: ["margin", "spacing", "padding", "border-spacing"], a: 2 },
                { q: "How do you display hyperlinks without an underline?", o: ["text-decoration: none", "underline: none", "decoration: no-underline", "text-style: no-underline"], a: 0 },
                { q: "Which property specifies the stack order of an element?", o: ["z-index", "s-index", "stack-order", "position"], a: 0 }
            ],
            js: [
                { q: "Inside which HTML element do we put the JavaScript?", o: ["<script>", "<js>", "<javascript>", "<scripting>"], a: 0 },
                { q: "How do you write 'Hello World' in an alert box?", o: ["msgBox('Hello World');", "alertBox('Hello World');", "msg('Hello World');", "alert('Hello World');"], a: 3 },
                { q: "How do you declare a variable in ES6?", o: ["var", "dim", "let", "int"], a: 2 },
                { q: "Which operator checks for both value and type?", o: ["==", "===", "=", "!="], a: 1 },
                { q: "How do you create a function in JavaScript?", o: ["function = myFunction()", "function myFunction()", "function:myFunction()", "create myFunction()"], a: 1 },
                { q: "How do you call a function named 'myFunction'?", o: ["call myFunction()", "call function myFunction()", "myFunction()", "Call.myFunction()"], a: 2 },
                { q: "How to write an IF statement in JavaScript?", o: ["if i = 5 then", "if i == 5 then", "if (i == 5)", "if i = 5"], a: 2 },
                { q: "How does a WHILE loop start?", o: ["while (i <= 10)", "while i = 1 to 10", "while (i <= 10; i++)", "while i <= 10"], a: 0 },
                { q: "How can you add a comment in JavaScript?", o: ["'This is a comment", "", "//This is a comment", "*This is a comment"], a: 2 },
                { q: "Which event occurs when the user clicks on an HTML element?", o: ["onmouseclick", "onchange", "onclick", "onmouseover"], a: 2 }
            ],
            java: [
                { q: "Which data type is used to create a variable that should store text?", o: ["String", "txt", "string", "Text"], a: 0 },
                { q: "How do you create a method in Java?", o: ["methodName()", "(methodName)", "methodName[]", "methodName{}"], a: 0 },
                { q: "Which keyword is used to create a class?", o: ["class", "MyClass", "class()", "className"], a: 0 },
                { q: "What is the correct syntax to output 'Hello World' in Java?", o: ["print('Hello World');", "Console.WriteLine('Hello World');", "echo('Hello World');", "System.out.println('Hello World');"], a: 3 },
                { q: "How do you insert comments in Java code?", o: ["# This is a comment", "// This is a comment", "/* This is a comment", ""], a: 1 },
                { q: "Which data type is used to create a variable that should store numbers including decimals?", o: ["int", "float", "String", "bool"], a: 1 },
                { q: "Which operator is used to compare two values?", o: ["=", "<>", "==", "><"], a: 2 },
                { q: "To declare an array in Java, define the variable type with:", o: ["()", "{}", "[]", "<>"], a: 2 },
                { q: "Which keyword is used to import a package from the Java API library?", o: ["package", "getlib", "import", "lib"], a: 2 },
                { q: "Which statement is used to stop a loop?", o: ["stop", "break", "return", "exit"], a: 1 }
            ],
            c: [
                { q: "How do you insert COMMENTS in C code?", o: ["// Comment", "/* Comment */", "# Comment", "-- Comment"], a: 0 },
                { q: "Which format specifier is used to print integers?", o: ["%c", "%d", "%f", "%s"], a: 1 },
                { q: "Which function is used to output text to the screen?", o: ["print()", "printf()", "console()", "write()"], a: 1 },
                { q: "Which function is used to read input from the user?", o: ["scanf()", "get()", "input()", "read()"], a: 0 },
                { q: "How do you declare an integer variable?", o: ["int x;", "integer x;", "num x;", "x = int;"], a: 0 },
                { q: "Which operator is used to get the memory address of a variable?", o: ["*", "&", "@", "#"], a: 1 },
                { q: "What is the correct syntax to include a header file?", o: ["#include <stdio.h>", "include <stdio.h>", "#import <stdio.h>", "import stdio.h"], a: 0 },
                { q: "Which keyword is used to exit from a function?", o: ["break", "exit", "return", "stop"], a: 2 },
                { q: "Array index starts from?", o: ["1", "0", "-1", "Depends on OS"], a: 1 },
                { q: "What does 'void' return type mean?", o: ["Returns 0", "Returns null", "Returns nothing", "Returns 1"], a: 2 }
            ],
            cpp: [
                { q: "Which operator is used to output data in C++?", o: [">>", "<<", "print", "cout"], a: 1 },
                { q: "How do you create a reference variable?", o: ["&", "*", "ref", "$"], a: 0 },
                { q: "Which header file is needed for input/output?", o: ["<stdio.h>", "<iostream>", "<conio.h>", "<stdlib.h>"], a: 1 },
                { q: "Which keyword is used to create a class?", o: ["struct", "class", "object", "type"], a: 1 },
                { q: "How do you access a member function of an object?", o: [".", "->", ":", "::"], a: 0 },
                { q: "Which special function is called when an object is created?", o: ["Destructor", "Constructor", "Initializer", "Main"], a: 1 },
                { q: "Which access specifier makes members accessible only within the class?", o: ["public", "protected", "private", "hidden"], a: 2 },
                { q: "How do you inherit a class in C++?", o: ["class B : public A", "class B extends A", "class B inherits A", "class B implements A"], a: 0 },
                { q: "Which keyword is used for dynamic memory allocation?", o: ["malloc", "alloc", "new", "create"], a: 2 },
                { q: "Which keyword is used to delete dynamically allocated memory?", o: ["remove", "free", "delete", "clear"], a: 2 }
            ],
            csharp: [
                { q: "Which method is the entry point of a C# application?", o: ["Main", "Start", "Init", "Run"], a: 0 },
                { q: "How do you write a line of text to the console?", o: ["Console.Write()", "print()", "System.out.println()", "cout"], a: 0 },
                { q: "Which keyword is used to create an object?", o: ["new", "create", "make", "obj"], a: 0 },
                { q: "Which data type specifies a whole number?", o: ["float", "int", "string", "bool"], a: 1 },
                { q: "How do you start a single line comment?", o: ["//", "/*", "#", "--"], a: 0 },
                { q: "Which operator refers to an object's member?", o: [".", "->", "::", "#"], a: 0 },
                { q: "Which keyword is used to define a class?", o: ["class", "struct", "object", "type"], a: 0 },
                { q: "In C#, string text must be enclosed in?", o: ["Single quotes", "Double quotes", "Brackets", "Parentheses"], a: 1 },
                { q: "Which property is used to find the length of a string?", o: ["Length", "len", "getLength()", "size"], a: 0 },
                { q: "Which keyword is used to inherit a class?", o: [":", "extends", "inherits", "implements"], a: 0 }
            ]
        };

        // --- 2. GAME VARIABLES ---
        let currentLang = '';
        let currentQuestions = [];
        let currentQIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 15;
        const totalQuestionsPerGame = 10; 

        // --- 3. DOM ELEMENTS ---
        const menuScreen = document.getElementById('menuScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressBar = document.getElementById('progressBar');
        const qProgress = document.getElementById('q-progress');
        const scoreLive = document.getElementById('score-live');
        const timerEl = document.getElementById('timer');

        // --- 4. FUNCTIONS ---

        function goHome() {
            clearInterval(timerInterval);
            menuScreen.style.display = 'flex';
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'none';
        }

        function startGame(lang) {
            currentLang = lang;
            
            let allQ = database[lang] || [];
            
            if(allQ.length === 0) { alert("Questions coming soon for this language!"); return; }

            let shuffled = [...allQ];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            currentQuestions = shuffled.slice(0, Math.min(totalQuestionsPerGame, shuffled.length));
            
            currentQIndex = 0;
            score = 0;
            
            menuScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            
            loadQuestion();
        }

        function restartCurrent() {
            startGame(currentLang);
        }

        function loadQuestion() {
            if (currentQIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            const qData = currentQuestions[currentQIndex];
            
            // UI Updates
            questionText.innerText = qData.q;
            qProgress.innerText = `Question ${currentQIndex + 1}/${currentQuestions.length}`;
            scoreLive.innerText = `Score: ${score}`;
            progressBar.style.width = `${((currentQIndex) / currentQuestions.length) * 100}%`;
            
            // Clear Options
            optionsContainer.innerHTML = '';
            
            // Generate Options
            qData.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, qData.a, btn);
                optionsContainer.appendChild(btn);
            });

            // Timer Reset
            clearInterval(timerInterval);
            timeLeft = 15;
            timerEl.innerText = timeLeft;
            timerEl.style.color = 'var(--primary)';
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if(timeLeft <= 5) timerEl.style.color = 'var(--danger)';
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoFail(); // Time's up logic
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            clearInterval(timerInterval);
            
            // Disable all clicks
            const allOpts = document.querySelectorAll('.option');
            allOpts.forEach(o => o.classList.add('disabled'));

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score += 10 + Math.max(0, Math.floor(timeLeft / 2)); // Bonus for speed
            } else {
                btnElement.classList.add('wrong');
                // Highlight correct one
                allOpts[correctIndex].classList.add('correct');
            }

            // Next Question Delay
            setTimeout(() => {
                currentQIndex++;
                loadQuestion();
            }, 1500);
        }

        function autoFail() {
            const allOpts = document.querySelectorAll('.option');
            allOpts.forEach(o => o.classList.add('disabled'));
            
            // Show correct answer
            const qData = currentQuestions[currentQIndex];
            allOpts[qData.a].classList.add('correct');

            setTimeout(() => {
                currentQIndex++;
                loadQuestion();
            }, 2000);
        }

        function endGame() {
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'flex';
            
            document.getElementById('finalScore').innerText = score;
            const msg = document.getElementById('resultMsg');
            const circle = document.getElementById('finalCircle');
            
            const maxPossible = currentQuestions.length * 17; 
            const percentage = (score / maxPossible) * 100;
            
            circle.style.background = `conic-gradient(var(--primary) ${percentage}%, #333 0%)`;

            if (percentage > 80) { msg.innerText = "Code Master! 🏆"; msg.style.color = "var(--success)"; }
            else if (percentage > 40) { msg.innerText = "Good Effort! 👍"; msg.style.color = "var(--primary)"; }
            else { msg.innerText = "Keep Practicing! 📚"; msg.style.color = "var(--danger)"; }
        }

        // --- 5. PARTICLE BACKGROUND ---
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.color = Math.random() > 0.5 ? 'rgba(0, 210, 255, 0.3)' : 'rgba(112, 0, 255, 0.3)';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initParticles() {
            for(let i=0; i<60; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; 
        });
        initParticles(); animateParticles();

        // --- 6. SECURITY SCRIPT (Anti-Theft) ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>
</body>
</html>
