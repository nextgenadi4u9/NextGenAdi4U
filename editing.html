<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing Zone - Discover Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop id="myVideo">
        <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="home.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                </a>
                
                <a href="home.html">
                    <img src="header.png" alt="Brand Logo">
                </a>
            </div>

            <div class="social-nav">
                <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://telegram.org/" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="https://discord.com/" target="_blank"><i class="fab fa-discord"></i></a>
            </div>

            <div class="search-bar">
                <input type="text" placeholder="Search Category...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero page-hero">
            <h1 class="main-heading">Editing Resources</h1>
            <p class="sub-text">Everything you need for Content Creation</p>
        </section>

        <section class="categories-container">
            
            <a href="bgmusic.html" class="category-card">
                <div class="cat-icon"><i class="fas fa-music"></i></div>
                <div class="cat-info">
                    <h3>Background Music</h3>
                    <p>NCS, Lo-Fi, Cinematic & Trending Audio</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

            <a href="materials.html" class="category-card">
                <div class="cat-icon"><i class="fas fa-photo-video"></i></div>
                <div class="cat-info">
                    <h3>Editing Materials</h3>
                    <p>Presets, LUTs, Overlays & XMLs</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-bottom">
                <p>&copy; 2026 NextGenAdi4U. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const searchInput = document.querySelector('.search-bar input');
            const cards = document.querySelectorAll('.category-card');

            if (searchInput) {
                searchInput.addEventListener('keyup', function(event) {
                    const query = event.target.value.toLowerCase();

                    cards.forEach(card => {
                        const titleElement = card.querySelector('h3');
                        const descElement = card.querySelector('p');

                        if (titleElement && descElement) {
                            const title = titleElement.textContent.toLowerCase();
                            const desc = descElement.textContent.toLowerCase();

                            if (title.includes(query) || desc.includes(query)) {
                                card.style.display = "flex";
                            } else {
                                card.style.display = "none";
                            }
                        }
                    });
                });
            }
        });
    </script>

</body>
</html>
