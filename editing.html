<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d2ff">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6262033771925685" crossorigin="anonymous"></script>
    
    <title>Editing Zone - NextGenAdi4U</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 1. GLOBAL VARIABLES & RESET --- */
        :root {
            --primary-color: #00d2ff;
            --secondary-color: #007bb5;
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Particle Background */
        #dustCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background: radial-gradient(circle at center, #0f1520 0%, #000000 100%);
        }

        a { text-decoration: none; transition: 0.3s; }
        
        /* --- 2. HEADER SECTION --- */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: var(--glass-border);
            padding: 15px 5%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .header-container {
            display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto;
        }

        .logo { display: flex; align-items: center; gap: 15px; }
        
        .brand-text {
            font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: #fff; margin: 0;
        }
        .brand-highlight { color: var(--primary-color); }

        .back-btn {
            color: var(--primary-color); font-size: 1.4rem; padding: 5px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: rgba(0, 210, 255, 0.1); transform: translateX(-5px); }

        /* Search Bar */
        .search-box {
            position: relative; width: 300px;
        }
        .search-box input {
            width: 100%; padding: 10px 45px 10px 20px;
            border-radius: 50px; border: 1px solid #333;
            background: rgba(255, 255, 255, 0.05); color: #fff;
            outline: none; font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            background: rgba(0,0,0,0.8);
        }
        .search-box button {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer;
        }
        .search-box input:focus + button { color: var(--primary-color); }

        @media (max-width: 768px) {
            .header-container { flex-direction: column; gap: 15px; }
            .search-box { width: 100%; }
            .social-nav { display: none; }
        }

        /* --- 3. HERO SECTION --- */
        .hero {
            text-align: center; padding: 60px 20px 40px;
        }
        .hero h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 3rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; color: transparent;
        }
        .hero p { color: var(--primary-color); font-size: 1.1rem; }

        /* --- 4. CATEGORY CARDS --- */
        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 5% 80px;
            max-width: 1200px; margin: 0 auto;
        }

        .category-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .category-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(30, 30, 30, 0.85);
            border-color: var(--primary-color);
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
        }

        /* Animated Glow Border on Hover */
        .category-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0,210,255,0.1), transparent);
            transform: translateX(-100%); transition: 0.6s;
        }
        .category-card:hover::before { transform: translateX(100%); }

        .cat-icon {
            font-size: 3rem; color: #555;
            background: rgba(255,255,255,0.05);
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.4s;
        }
        .category-card:hover .cat-icon {
            background: var(--primary-color); color: #000;
            transform: rotate(15deg) scale(1.1);
            box-shadow: 0 0 20px var(--primary-color);
        }

        .cat-info { flex: 1; margin-left: 20px; }
        
        .cat-info h3 {
            font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: 5px;
            transition: 0.3s;
        }
        .category-card:hover .cat-info h3 { color: var(--primary-color); }

        .cat-info p { font-size: 0.95rem; color: var(--text-muted); }

        .arrow {
            font-size: 1.2rem; color: #555;
            border: 1px solid #444; border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .category-card:hover .arrow {
            background: #fff; color: #000; border-color: #fff;
            transform: translateX(5px);
        }

        /* --- 5. FOOTER --- */
        footer {
            border-top: var(--glass-border); padding: 30px; text-align: center;
            color: #666; font-size: 0.9rem; background: #000;
        }
    </style>
</head>
<body>

    <canvas id="dustCanvas"></canvas>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <a href="home.html">
                    <h2 class="brand-text">NextGen<span class="brand-highlight">Adi4U</span></h2>
                </a>
            </div>

            <div class="social-nav" style="display: flex; gap: 15px;">
                 <a href="https://www.youtube.com/channel/UCEkAwiNuddUI5aXCN4x3spA" target="_blank" style="color:#fff"><i class="fab fa-youtube"></i></a>
                 <a href="https://www.instagram.com/nextgen.adi4u" target="_blank" style="color:#fff"><i class="fab fa-instagram"></i></a>
                 <a href="https://t.me/nextgenadi4u" target="_blank" style="color:#fff"><i class="fab fa-telegram"></i></a>
                 <a href="https://discord.gg/jG2fpvjwnk" target="_blank" style="color:#fff"><i class="fab fa-discord"></i></a>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Find Category...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" data-aos="fade-down">
            <h1>Editing Resources</h1>
            <p>Everything you need for Content Creation</p>
        </section>

        <section class="categories-container">
            
            <a href="bgmusic.html" class="category-card" data-aos="fade-up" data-aos-delay="100">
                <div class="cat-icon"><i class="fas fa-music"></i></div>
                <div class="cat-info">
                    <h3>Background Music</h3>
                    <p>NCS, Lo-Fi, Cinematic & Trending Audio.</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

            <a href="materials.html" class="category-card" data-aos="fade-up" data-aos-delay="200">
                <div class="cat-icon"><i class="fas fa-photo-video"></i></div>
                <div class="cat-info">
                    <h3>Editing Materials</h3>
                    <p>Presets, LUTs, Overlays, VFX & XMLs.</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 NextGenAdi4U. All Rights Reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Init Animation
        AOS.init({ duration: 800, once: true, offset: 50 });

        // Search Logic
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.category-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                const desc = card.querySelector('p').textContent.toLowerCase();
                if (title.includes(term) || desc.includes(term)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        });

        // Particle Background Logic
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
        init(); animate();
    </script>
</body>
</html>
