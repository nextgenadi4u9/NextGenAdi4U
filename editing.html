<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d2ff">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6262033771925685" crossorigin="anonymous"></script>
    
    <title>Editing Zone - NextGenAdi4U</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- PAGE SPECIFIC STYLES --- */
        :root {
            --primary-color: #00d2ff;
            --card-bg: rgba(20, 20, 20, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --text-muted: #a0a0a0;
        }

        body {
            /* Anti-Theft: Prevent Text Selection */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* --- GRID LAYOUT --- */
        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 5% 80px;
            max-width: 1200px; margin: 0 auto;
        }

        .category-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .category-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(30, 30, 30, 0.85);
            border-color: var(--primary-color);
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
        }

        /* Animated Glow Border on Hover */
        .category-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0,210,255,0.1), transparent);
            transform: translateX(-100%); transition: 0.6s;
        }
        .category-card:hover::before { transform: translateX(100%); }

        .cat-icon {
            font-size: 3rem; color: #555;
            background: rgba(255,255,255,0.05);
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.4s;
        }
        .category-card:hover .cat-icon {
            background: var(--primary-color); color: #000;
            transform: rotate(15deg) scale(1.1);
            box-shadow: 0 0 20px var(--primary-color);
        }

        .cat-info { flex: 1; margin-left: 20px; }
        
        .cat-info h3 {
            font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: 5px;
            transition: 0.3s;
        }
        .category-card:hover .cat-info h3 { color: var(--primary-color); }

        .cat-info p { font-size: 0.95rem; color: var(--text-muted); }

        .arrow {
            font-size: 1.2rem; color: #555;
            border: 1px solid #444; border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .category-card:hover .arrow {
            background: #fff; color: #000; border-color: #fff;
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <canvas id="dustCanvas"></canvas>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <a href="index.html">
                    <h2 class="brand-text">NextGen<span class="brand-highlight">Adi4U</span></h2>
                </a>
            </div>

            <div class="social-nav" style="display: flex; gap: 15px;">
                 <a href="https://www.youtube.com/channel/UCEkAwiNuddUI5aXCN4x3spA" target="_blank" style="color:#fff"><i class="fab fa-youtube"></i></a>
                 <a href="https://www.instagram.com/nextgen.adi4u" target="_blank" style="color:#fff"><i class="fab fa-instagram"></i></a>
                 <a href="https://t.me/nextgenadi4u" target="_blank" style="color:#fff"><i class="fab fa-telegram"></i></a>
                 <a href="https://discord.gg/jG2fpvjwnk" target="_blank" style="color:#fff"><i class="fab fa-discord"></i></a>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Find Category...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" data-aos="fade-down">
            <h1 style="font-family: 'Rajdhani', sans-serif; font-size: 3rem; text-transform: uppercase; margin-bottom: 10px; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; color: transparent;">Editing Resources</h1>
            <p style="color: var(--primary-color);">Everything you need for Content Creation</p>
        </section>

        <section class="categories-container">
            
            <a href="bgmusic.html" class="category-card" data-aos="fade-up" data-aos-delay="100">
                <div class="cat-icon"><i class="fas fa-music"></i></div>
                <div class="cat-info">
                    <h3>Background Music</h3>
                    <p>NCS, Lo-Fi, Cinematic & Trending Audio.</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

            <a href="materials.html" class="category-card" data-aos="fade-up" data-aos-delay="200">
                <div class="cat-icon"><i class="fas fa-photo-video"></i></div>
                <div class="cat-info">
                    <h3>Editing Materials</h3>
                    <p>Presets, LUTs, Overlays, VFX & XMLs.</p>
                </div>
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 NextGenAdi4U. All Rights Reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Init Animation
        AOS.init({ duration: 800, once: true, offset: 50 });

        // Search Logic
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.category-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                const desc = card.querySelector('p').textContent.toLowerCase();
                if (title.includes(term) || desc.includes(term)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        });

        // Particle Background Logic
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
        init(); animate();

        // --- SECURITY SCRIPT (Anti-Theft) ---
        // 1. Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable Keyboard Shortcuts (F12, Ctrl+U, etc.)
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false; // Ctrl+S
        }

        // 3. Disable Image Dragging
        document.querySelectorAll('img').forEach(img => {
            img.setAttribute('draggable', false);
        });
    </script>
</body>
</html>
