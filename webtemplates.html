<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD700">
    
    

    <title>Premium Web Templates - NextGenAdi4U</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GOLDEN PREMIUM THEME VARIABLES --- */
        :root {
            --primary: #FFD700;       /* Pure Gold */
            --primary-dark: #B8860B;  /* Dark Gold */
            --bg-dark: #050505;       /* Deep Black */
            --card-bg: rgba(20, 20, 20, 0.8);
            --glass-border: 1px solid rgba(255, 215, 0, 0.15); /* Gold Border */
            --text-main: #ffffff;
            --text-muted: #d4d4d4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
            
            /* Anti-Theft */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Gold Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        /* Particle Background */
        #dustCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background: radial-gradient(circle at center, #1a1a00 0%, #000000 100%);
        }

        /* --- NAVIGATION --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--primary-dark);
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.1);
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        
        .nav-links a { 
            color: #fff; text-decoration: none; margin-left: 20px; font-weight: 600; transition: 0.3s; 
        }
        .nav-links a:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        /* --- HERO SECTION --- */
        .hero { text-align: center; padding: 80px 20px 40px; }
        .main-heading {
            font-family: 'Rajdhani', sans-serif; font-size: 3.5rem; text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--primary), #fff);
            -webkit-background-clip: text; color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); margin-bottom: 10px;
        }
        .sub-text { font-size: 1.2rem; color: var(--text-muted); }

        /* --- TABS --- */
        .tab-container {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #333; color: #aaa;
            padding: 12px 30px; border-radius: 50px; cursor: pointer; font-size: 1rem;
            transition: 0.4s; font-weight: 600; display: flex; align-items: center; gap: 10px;
        }
        .tab-btn:hover { border-color: var(--primary); color: #fff; }
        .active-btn {
            background: var(--primary); color: #000; border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* --- SECTIONS --- */
        .template-section { display: none; padding: 0 5% 80px; max-width: 1400px; margin: 0 auto; }
        .active-sec { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

        .shopify-grid, .github-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px;
        }

        /* --- GOLDEN CARD DESIGN --- */
        .card {
            background: var(--card-bg); border: var(--glass-border); border-radius: 20px;
            overflow: hidden; transition: 0.4s ease; position: relative;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.15);
        }

        /* IMAGE FIX: FULL VISIBILITY */
        .card-img-wrapper {
            width: 100%; height: 220px; /* Tall height */
            background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 15px; position: relative; cursor: pointer; overflow: hidden;
        }
        
        .card-img-wrapper img {
            width: 100%; height: 100%; 
            object-fit: contain; /* CRITICAL: No Crop */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: 0.5s;
        }
        .card:hover img { transform: scale(1.08); filter: brightness(1.1) drop-shadow(0 0 15px rgba(255,215,0,0.2)); }

        /* Preview Eye Icon */
        .card-img-wrapper::after {
            content: '\f06e'; font-family: 'Font Awesome 5 Free'; font-weight: 900;
            position: absolute; font-size: 3rem; color: var(--primary);
            opacity: 0; transform: scale(0.5); transition: 0.3s;
            text-shadow: 0 0 20px #000;
        }
        .card-img-wrapper:hover::after { opacity: 1; transform: scale(1); }

        /* Card Content */
        .card-body { padding: 20px; text-align: center; }
        .card-title {
            font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700;
            color: #fff; margin-bottom: 5px;
        }
        .prices { margin-bottom: 15px; }
        .market-price { text-decoration: line-through; color: #666; font-size: 0.9rem; margin-right: 10px; }
        .our-price { color: var(--primary); font-weight: 800; font-size: 1.4rem; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
        
        .card-desc { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; line-height: 1.5; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .card-btn {
            padding: 10px 20px; border-radius: 50px; font-weight: 600; cursor: pointer;
            border: none; transition: 0.3s; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
        }
        .preview-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #444; }
        .preview-btn:hover { background: #fff; color: #000; }
        
        .buy-btn {
            background: linear-gradient(45deg, var(--primary-dark), var(--primary));
            color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .buy-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--primary);
            max-width: 600px; width: 90%; text-align: center; position: relative;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2); animation: popIn 0.3s ease;
        }
        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 2rem; color: #fff; cursor: pointer;
        }
        .modal-close:hover { color: var(--danger, #ff4444); }

        /* Platform Grid */
        .platform-grid { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
        .plat-btn {
            width: 70px; height: 70px; border-radius: 18px; display: flex;
            align-items: center; justify-content: center; font-size: 2.2rem;
            color: #fff; transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .plat-btn:hover { transform: translateY(-5px); }
        .tg-btn { background: #0088cc; box-shadow: 0 0 20px rgba(0, 136, 204, 0.4); }
        .ig-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 0 20px rgba(220, 39, 67, 0.4); }
        .dc-btn { background: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }

        /* Preview Image Container */
        .preview-img-box {
            width: 100%; max-height: 400px; overflow-y: auto; border-radius: 10px;
            margin-bottom: 20px; border: 1px solid #333; background: #000;
        }
        .full-preview-img { width: 100%; display: block; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Footer */
        footer { margin-top: auto; border-top: 1px solid #333; padding: 30px; text-align: center; color: #666; }

    </style>
</head>
<body>

    <canvas id="dustCanvas"></canvas>

    <nav class="navbar">
        <a href="index.html" class="logo">NextGen<span>Adi4U</span></a>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="Contact.html"><i class="fas fa-envelope"></i> Contact</a>
        </div>
    </nav>

    <div class="hero page-hero" data-aos="fade-down">
        <h1 class="main-heading">Premium Themes Store</h1>
        <p class="sub-text">Unlocked Shopify Themes & Source Codes @ <span style="color:var(--primary); font-weight:bold;">95% OFF</span></p>
    </div>

    <div class="tab-container" data-aos="fade-up">
        <button class="tab-btn active-btn" onclick="switchTab('shopify')"><i class="fab fa-shopify"></i> Shopify Themes</button>
        <button class="tab-btn" onclick="switchTab('github')"><i class="fab fa-github"></i> GitHub Codes</button>
    </div>

    <section id="shopify-sec" class="template-section active-sec">
        <div class="shopify-grid" id="shopify-container">
            </div>
    </section>

    <section id="github-sec" class="template-section">
        <div class="github-grid" id="github-container">
            </div>
    </section>

    <div class="modal-overlay" id="buyModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('buyModal')">&times;</span>
            <h2 style="color:var(--primary); margin-bottom:10px;">Purchase Request</h2>
            <p style="color:#aaa;">To buy this item securely, contact Admin directly:</p>
            
            <div class="platform-grid">
                <div class="plat-btn tg-btn" onclick="redirectTo('telegram')" title="Fastest Reply"><i class="fab fa-telegram-plane"></i></div>
                <div class="plat-btn ig-btn" onclick="redirectTo('instagram')" title="Instagram"><i class="fab fa-instagram"></i></div>
                <div class="plat-btn dc-btn" onclick="redirectTo('discord')" title="Discord"><i class="fab fa-discord"></i></div>
            </div>
            <p style="margin-top:20px; font-size:0.8rem; color:#666;">*Instant Delivery after payment</p>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-content" style="max-width: 900px;">
            <span class="modal-close" onclick="closeModal('previewModal')">&times;</span>
            <h2 id="previewTitle" style="color:#fff; margin-bottom: 15px;">Theme Preview</h2>
            <div class="preview-img-box">
                <img src="" id="previewImage" class="full-preview-img" alt="Theme Preview">
            </div>
            <button class="card-btn buy-btn" style="width:100%; justify-content:center; font-size:1.1rem; padding:15px;" onclick="openBuyModalFromPreview()">
                Buy Now - Limited Offer 🔥
            </button>
        </div>
    </div>

    <footer>
        &copy; 2026 Aditya Shete Solutions. All Rights Reserved.
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // --- 1. DATA (Images will fit perfectly) ---
        const themes = [
            {
                id: 1, type: 'shopify', name: "Impulse - High Fashion", marketPrice: "₹28,000", ourPrice: "₹299",
                image: "https://cdn.shopify.com/s/files/1/0264/6360/0726/files/impulse-theme_600x600.jpg", 
                desc: "Best for clothing brands. High conversion rate & fast loading."
            },
            {
                id: 2, type: 'shopify', name: "Prestige - Luxury Store", marketPrice: "₹30,000", ourPrice: "₹499",
                image: "https://themes.shopifycdn.com/themes/prestige/styles/couture/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Premium look for jewelry and luxury items. 98% Off."
            },
            {
                id: 3, type: 'shopify', name: "Motion - Video Based", marketPrice: "₹25,000", ourPrice: "₹199",
                image: "https://themes.shopifycdn.com/themes/motion/styles/classic/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Perfect for storytelling with video backgrounds."
            },
            {
                id: 4, type: 'shopify', name: "Impact - Bold Design", marketPrice: "₹29,000", ourPrice: "₹399",
                image: "https://themes.shopifycdn.com/themes/impact/styles/default/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Modern gradients and big typography for tech stores."
            },
            {
                id: 5, type: 'shopify', name: "Warehouse - Large Catalog", marketPrice: "₹26,000", ourPrice: "₹249",
                image: "https://themes.shopifycdn.com/themes/warehouse/styles/metal/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Designed for stores with huge inventory like Amazon."
            },
            {
                id: 101, type: 'github', name: "Jod Cheats Source Code", marketPrice: "₹15,000", ourPrice: "₹999",
                image: "https://github.blog/wp-content/uploads/2020/12/102393310-72733280-3f97-11eb-81c4-14227c44400e.png",
                desc: "Full C++ Source code with Bypass Login System."
            }
        ];

        // --- 2. RENDER LOGIC ---
        const shopifyContainer = document.getElementById('shopify-container');
        const githubContainer = document.getElementById('github-container');

        function renderProducts() {
            shopifyContainer.innerHTML = '';
            githubContainer.innerHTML = '';

            themes.forEach(product => {
                const cardHTML = `
                    <div class="card" data-aos="fade-up">
                        <div class="card-img-wrapper" onclick="openPreview(${product.id})" title="Click to Expand">
                            <img src="${product.image}" alt="${product.name}">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${product.name}</div>
                            <div class="prices">
                                <span class="market-price">${product.marketPrice}</span>
                                <span class="our-price">${product.ourPrice}</span>
                            </div>
                            <p class="card-desc">${product.desc}</p>
                            
                            <div class="btn-group">
                                <button class="card-btn preview-btn" onclick="openPreview(${product.id})">
                                    <i class="fas fa-eye"></i> View
                                </button>
                                <button class="card-btn buy-btn" onclick="initiateBuy(${product.id})">
                                    Buy Now <i class="fas fa-bolt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                if(product.type === 'shopify') shopifyContainer.innerHTML += cardHTML;
                else githubContainer.innerHTML += cardHTML;
            });
        }
        renderProducts();

        // --- 3. LOGIC & MODALS ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-btn'));
            document.querySelectorAll('.template-section').forEach(sec => sec.classList.remove('active-sec'));

            if(tab === 'shopify') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active-btn');
                document.getElementById('shopify-sec').classList.add('active-sec');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active-btn');
                document.getElementById('github-sec').classList.add('active-sec');
            }
        }

        let selectedProduct = null;

        function openPreview(id) {
            const product = themes.find(p => p.id === id);
            if(!product) return;
            selectedProduct = product;
            
            document.getElementById('previewTitle').innerText = product.name;
            document.getElementById('previewImage').src = product.image;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function openBuyModalFromPreview() {
            closeModal('previewModal');
            if(selectedProduct) initiateBuy(selectedProduct.id);
        }

        function initiateBuy(id) {
            const product = themes.find(p => p.id === id);
            selectedProduct = product;
            document.getElementById('buyModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function redirectTo(platform) {
            if(!selectedProduct) return;
            
            const text = `Hello Aditya! 👋%0AI want to buy:%0A%0A📦 *${selectedProduct.name}*%0A💰 Offer Price: ${selectedProduct.ourPrice}%0A%0APlease send QR Code.`;
            
            let url = "";
            if(platform === 'telegram') url = `https://t.me/nextgenadi_4u?text=${text}`; // Updated ID
            else if(platform === 'instagram') url = `https://instagram.com/aditya_shete_official`; 
            else if(platform === 'discord') url = `https://discord.gg/YOUR_CODE`; 

            window.open(url, '_blank');
            closeModal('buyModal');
        }

        window.onclick = function(event) {
            if (event.target.className === 'modal-overlay') {
                event.target.style.display = "none";
            }
        }

        // --- 4. GOLDEN PARTICLES ---
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.color = 'rgba(255, 215, 0, 0.3)'; // Gold Color
            }
            update() { this.x += this.speedX; this.y += this.speedY; if(this.x>canvas.width)this.x=0; if(this.x<0)this.x=canvas.width; if(this.y>canvas.height)this.y=0; if(this.y<0)this.y=canvas.height; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<60; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw()}); requestAnimationFrame(animate); }
        animate();

        // --- 5. SECURITY SCRIPT (Anti-Theft) ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
        document.querySelectorAll('img').forEach(img => img.setAttribute('draggable', false));
    </script>
</body>
</html>
