<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d2ff">
    <title>Web Templates - NextGenAdi4U</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- Page Specific Styles --- */
        .market-price {
            text-decoration: line-through; color: #666; font-size: 0.9rem; margin-right: 10px;
        }
        .our-price {
            color: #00ff88; font-weight: 800; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }
        
        /* Image Hover Effect for Direct Preview */
        .card-img {
            cursor: pointer; position: relative;
        }
        .card-img::after {
            content: '\f06e'; /* FontAwesome Eye Icon Code */
            font-family: 'Font Awesome 5 Free'; font-weight: 900;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 3rem; color: #fff; text-shadow: 0 0 20px #000;
            transition: 0.3s; opacity: 0;
        }
        .card-img:hover::after { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .card-img:hover img { filter: brightness(0.5); transform: scale(1.1); }

        /* Modal (Preview & Buy) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--primary);
            max-width: 500px; width: 90%; text-align: center; position: relative;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2); animation: popIn 0.3s ease;
        }
        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: #fff; cursor: pointer; transition: 0.3s;
        }
        .modal-close:hover { color: #ff0055; transform: rotate(90deg); }
        
        /* Platform Buttons */
        .platform-grid { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
        .plat-btn {
            width: 65px; height: 65px; border-radius: 18px; display: flex;
            align-items: center; justify-content: center; font-size: 2rem;
            color: #fff; transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .plat-btn:hover { transform: translateY(-8px) scale(1.1); }
        
        .tg-btn { background: #0088cc; box-shadow: 0 0 20px rgba(0, 136, 204, 0.4); }
        .ig-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 0 20px rgba(220, 39, 67, 0.4); }
        .dc-btn { background: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }

        /* Preview Image Container */
        .preview-container { width: 100%; height: 300px; overflow-y: scroll; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .preview-img { width: 100%; display: block; }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="dustCanvas"></canvas>

    <nav class="navbar">
        <a href="index.html" class="logo">NextGen<span>Adi4U</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Contact.html">Contact</a>
        </div>
    </nav>

    <div class="hero page-hero">
        <h1 class="main-heading">Premium Themes Store</h1>
        <p class="sub-text">Unlocked Shopify Themes & Source Codes @ <span style="color:#00ff88; font-weight:bold;">95% OFF</span></p>
    </div>

    <div class="tab-container" data-aos="fade-up">
        <button class="tab-btn active-btn" onclick="switchTab('shopify')"><i class="fab fa-shopify"></i> Shopify Themes</button>
        <button class="tab-btn" onclick="switchTab('github')"><i class="fab fa-github"></i> GitHub Codes</button>
    </div>

    <section id="shopify-sec" class="template-section active-sec">
        <div class="shopify-grid" id="shopify-container">
            </div>
    </section>

    <section id="github-sec" class="template-section">
        <div class="github-grid" id="github-container">
            </div>
    </section>

    <div class="modal-overlay" id="buyModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('buyModal')">&times;</span>
            <h2 style="color:var(--primary)">Send Requirement</h2>
            <p style="color:#aaa; margin-top:5px">Select platform to contact Admin:</p>
            
            <div class="platform-grid">
                <div class="plat-btn tg-btn" onclick="redirectTo('telegram')" title="Telegram"><i class="fab fa-telegram-plane"></i></div>
                <div class="plat-btn ig-btn" onclick="redirectTo('instagram')" title="Instagram"><i class="fab fa-instagram"></i></div>
                <div class="plat-btn dc-btn" onclick="redirectTo('discord')" title="Discord"><i class="fab fa-discord"></i></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-content" style="max-width: 800px;">
            <span class="modal-close" onclick="closeModal('previewModal')">&times;</span>
            <h2 id="previewTitle" style="color:#fff; margin-bottom: 10px;">Theme Preview</h2>
            <div class="preview-container">
                <img src="" id="previewImage" class="preview-img" alt="Theme Preview">
            </div>
            <button class="buy-btn" style="width:100%" onclick="openBuyModalFromPreview()">Buy Now - Limited Offer 🔥</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Aditya Shete Solutions. All Rights Reserved.
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // --- 1. THEME DATABASE ---
        // Tuze themes ithe add kar
        const themes = [
            {
                id: 1,
                type: 'shopify',
                name: "Impulse - High Fashion",
                marketPrice: "₹28,000",
                ourPrice: "₹299",
                image: "https://cdn.shopify.com/s/files/1/0264/6360/0726/files/impulse-theme_600x600.jpg", 
                desc: "Best for clothing brands. High conversion rate & fast loading."
            },
            {
                id: 2,
                type: 'shopify',
                name: "Prestige - Luxury Store",
                marketPrice: "₹30,000",
                ourPrice: "₹499",
                image: "https://themes.shopifycdn.com/themes/prestige/styles/couture/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Premium look for jewelry and luxury items. 98% Off."
            },
            {
                id: 3,
                type: 'shopify',
                name: "Motion - Video Based",
                marketPrice: "₹25,000",
                ourPrice: "₹199",
                image: "https://themes.shopifycdn.com/themes/motion/styles/classic/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Perfect for storytelling with video backgrounds."
            },
            {
                id: 4,
                type: 'shopify',
                name: "Impact - Bold Design",
                marketPrice: "₹29,000",
                ourPrice: "₹399",
                image: "https://themes.shopifycdn.com/themes/impact/styles/default/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Modern gradients and big typography for tech stores."
            },
            {
                id: 5,
                type: 'shopify',
                name: "Warehouse - Large Catalog",
                marketPrice: "₹26,000",
                ourPrice: "₹249",
                image: "https://themes.shopifycdn.com/themes/warehouse/styles/metal/preview/images/157297926216/desktop_screenshot.jpg",
                desc: "Designed for stores with huge inventory like Amazon."
            },
            // GitHub Section
            {
                id: 101,
                type: 'github',
                name: "Jod Cheats Source Code",
                marketPrice: "₹15,000",
                ourPrice: "₹999",
                image: "https://github.blog/wp-content/uploads/2020/12/102393310-72733280-3f97-11eb-81c4-14227c44400e.png",
                desc: "Full C++ Source code with Bypass Login System."
            }
        ];

        // --- 2. RENDER LOGIC (Direct Preview on Image Click) ---
        const shopifyContainer = document.getElementById('shopify-container');
        const githubContainer = document.getElementById('github-container');

        function renderProducts() {
            shopifyContainer.innerHTML = '';
            githubContainer.innerHTML = '';

            themes.forEach(product => {
                const cardHTML = `
                    <div class="shopify-card" data-aos="fade-up">
                        <div class="card-img" onclick="openPreview(${product.id})" title="Click to Preview">
                            <img src="${product.image}" alt="${product.name}">
                        </div>
                        <div class="card-details">
                            <div class="card-title">${product.name}</div>
                            <div>
                                <span class="market-price">${product.marketPrice}</span>
                                <span class="our-price">${product.ourPrice}</span>
                            </div>
                            <p class="card-desc">${product.desc}</p>
                            
                            <div class="btn-group">
                                <button class="card-btn preview-btn" onclick="openPreview(${product.id})">
                                    <i class="fas fa-eye"></i> Preview
                                </button>
                                <button class="card-btn buy-btn" onclick="initiateBuy(${product.id})">
                                    Buy Now <i class="fas fa-shopping-cart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                if(product.type === 'shopify') shopifyContainer.innerHTML += cardHTML;
                else githubContainer.innerHTML += cardHTML;
            });
        }
        renderProducts();

        // --- 3. TAB LOGIC ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-btn'));
            document.querySelectorAll('.template-section').forEach(sec => sec.classList.remove('active-sec'));

            if(tab === 'shopify') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active-btn');
                document.getElementById('shopify-sec').classList.add('active-sec');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active-btn');
                document.getElementById('github-sec').classList.add('active-sec');
            }
        }

        // --- 4. PREVIEW SYSTEM ---
        let selectedProduct = null;

        function openPreview(id) {
            const product = themes.find(p => p.id === id);
            if(!product) return;
            selectedProduct = product;
            
            document.getElementById('previewTitle').innerText = product.name;
            document.getElementById('previewImage').src = product.image;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function openBuyModalFromPreview() {
            closeModal('previewModal');
            if(selectedProduct) initiateBuy(selectedProduct.id);
        }

        // --- 5. BUY SYSTEM (UPDATED USERNAME & MESSAGE) ---
        function initiateBuy(id) {
            const product = themes.find(p => p.id === id);
            selectedProduct = product;
            document.getElementById('buyModal').style.display = 'flex';
        }

        function redirectTo(platform) {
            if(!selectedProduct) return;
            
            // New "Requirement" Message Format
            const text = `Hello Aditya! 👋%0AI have a requirement for:%0A%0A📦 *${selectedProduct.name}*%0A💰 Price: ${selectedProduct.ourPrice}%0A%0APlease share the payment details.`;
            
            let url = "";
            if(platform === 'telegram') {
                // Updated Username: @nextgenadi_4u
                url = `https://t.me/nextgenadi_4u?text=${text}`;
            } else if(platform === 'instagram') {
                url = `https://instagram.com/aditya_shete_official`; 
                alert("Opening Instagram... DM manually.");
            } else if(platform === 'discord') {
                url = `https://discord.gg/YOUR_CODE`; 
                alert("Joining Discord Server...");
            }

            window.open(url, '_blank');
            closeModal('buyModal');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        window.onclick = function(event) {
            if (event.target.className === 'modal-overlay') {
                event.target.style.display = "none";
            }
        }

        // --- PARTICLE BACKGROUND ---
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25; this.speedY = Math.random() * 0.5 - 0.25;
                this.color = 'rgba(0, 210, 255, 0.3)';
            }
            update() { this.x += this.speedX; this.y += this.speedY; if(this.x>canvas.width)this.x=0; if(this.x<0)this.x=canvas.width; if(this.y>canvas.height)this.y=0; if(this.y<0)this.y=canvas.height; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<60; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw()}); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
